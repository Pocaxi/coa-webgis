<!doctype html>
<html lang="pt-BR"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a2b">
  <title>COA WebGIS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="../../css/app.css">
</head><body>
  <header class="topbar"><button id="menuButton" class="icon-button" aria-label="Abrir painel">☰</button><div class="brand"><strong>COA</strong><span id="mapTitle">WebGIS Agrícola</span></div><button id="fitButton" class="action-button">Ver talhão</button></header>
